name: Sync Model Catalog

# Keeps the generated model docs (snippets/model-data.jsx, models/*.mdx, docs.json)
# in step with the live gateway catalog. The generator consumes the /v1/models shape
# (flat pricing + capabilities + limitations); /v1/catalog is the models.dev shape and
# is not interchangeable here, so point `source` at a /v1/models-compatible payload.
#
# Nothing is published straight to main: a drift opens a PR, because these files carry
# customer-facing prices.

on:
  schedule:
    # 03:00 UTC daily (10:00 WIB) — outside the DeepSeek peak windows, no cost either way.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Model source (URL or local JSON path) in /v1/models shape'
        required: false
        default: 'https://api.neosantara.xyz/v1/models'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-model-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SOURCE: ${{ inputs.source || 'https://api.neosantara.xyz/v1/models' }}
      BRANCH: chore/sync-model-catalog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate model docs from the live catalog
        run: node scripts/sync-model-docs.js --source "$SOURCE"

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Model docs already match $SOURCE."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Open or update the sync PR
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore(models): sync model docs from $SOURCE"
          git push --force-with-lease origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title 'chore(models): sync model catalog' \
              --body "Generated by \`.github/workflows/sync-model-catalog.yml\` from \`$SOURCE\`.

          Review the pricing lines before merging — these files are what customers read."
          fi
